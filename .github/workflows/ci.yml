name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Typecheck, build and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  network:
    name: Real conformance delta on the bundled fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:network
      - name: Keep the raw suite output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: .mcp-migrate-delta/
          if-no-files-found: ignore
